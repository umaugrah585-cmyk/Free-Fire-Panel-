
name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check project files
        run: |
          echo "Checking project structure..."
          ls -la
          ls -la app

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build-error.log 2>&1
          RESULT=$?
          echo "========== BUILD ERROR SUMMARY =========="
          grep -n -A 12 -B 3 -E "What went wrong:|FAILURE:|Caused by:|error:" build-error.log | tail -100 || tail -60 build-error.log
          echo "========== END ERROR SUMMARY =========="
          exit $RESULT

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp-test-panel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
